name: plant_config
description: This plant is located in Texas, USA.
sites:
  site:
    latitude: 34.382308
    longitude: -101.816607
    resources:
      wind_resource:
        resource_model: WTKNLRDeveloperAPIWindResource
        resource_parameters:
          resource_year: 2013
          resource_dir: ../resources
      solar_resource:
        resource_model: GOESAggregatedSolarAPI
        resource_parameters:
          resource_year: 2013
          resource_dir: ../resources
# array of arrays containing left-to-right technology
# interconnections; can support bidirectional connections
# with the reverse definition.
#
# SLC-style wiring (mirrors examples/35_system_level_control/yes_battery):
# every producing tech feeds a single `combiner` which supplies the demand
# component; the SLC decides *how much* each producer contributes. Renewables
# also feed `battery` directly so the battery has a real charge input.
technology_interconnections:
  - [ng_feedstock, natural_gas_plant, natural_gas, pipe]
  # Aggregate renewables (solar + wind) into a single stream, used both for
  # renewable finance reporting and as one input to the combined supply.
  - [solar, renew_combiner, electricity, cable]
  - [wind, renew_combiner, electricity, cable]
  # Combine renewables + gas into the total dispatchable supply. This combined
  # stream is what can either charge the battery or serve the load, so gas
  # (not just renewables) is available to charge the battery per the UC plan.
  - [renew_combiner, supply_combiner, electricity, cable]
  - [natural_gas_plant, supply_combiner, electricity, cable]
  # The combined supply feeds the battery's charge input (single upstream
  # source) ...
  - [supply_combiner, battery, electricity, cable]
  # ... and also flows to the main combiner to serve the load.
  - [supply_combiner, combiner, electricity, cable]
  # The battery then adds its discharge (or subtracts its charge, since
  # battery.electricity_out is negative when charging) at the main combiner.
  - [battery, combiner, electricity, cable]
  # combined supply meets demand
  - [combiner, electrical_load_demand, electricity, cable]
  # UC control available generation forecasting connections
  - [solar, system_level_controller, [uncurtailed_electricity_out, solar_uncurtailed_electricity_out]]
  - [wind, system_level_controller, [uncurtailed_electricity_out, wind_uncurtailed_electricity_out]]
site_to_tech_connections:
  # connect the wind resource to the wind technology
  - [site.wind_resource, wind, wind_resource_data]
  - [site.solar_resource, solar, solar_resource_data]
plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760
    n_steps_per_compute: 24
    dt: 3600
# System-Level Controller: unit-commitment (UC) optimal dispatch.
#
# `UCControl` (defined in ./uc_control.py) is a custom subclass of
# H2Integrate's SystemLevelControlBase that plans gas and battery dispatch by
# solving a rolling-horizon unit-commitment MILP (uc_model.py, HiGHS/Pyomo)
# rather than following the greedy renewables -> gas -> battery priority of
# `DispatchableFirstControl` (single_case_slc). This case exists to compare
# UC-optimal dispatch against that greedy baseline.
#
# The class is registered into `supported_models` at runtime in run_case.py
# (H2Integrate's SLC framework does not scan `system_level_control` for
# `model_location`, so we can't declare it inline here).
#
# Classifiers (baked into each tech's performance model):
#   solar, wind       -> flexible     (commanded at rated availability)
#   natural_gas_plant -> dispatchable (UC decides hourly commitment/output)
#   battery           -> storage      (UC decides hourly charge/discharge)
system_level_control:
  control_strategy: UCControl
  demand_component: electrical_load_demand
  control_parameters:
    # UC gas-unit parameters (single aggregate NGCC, n_units = 1). Values are
    # read here so the UC MILP stays consistent with the tech_config plant.
    gas_price: 6.09  # $/MMBtu  (matches ng_feedstock price)
    heat_rate_mmbtu_per_mwh: 6.3  # MMBtu/MWh (matches natural_gas_plant)
    gas_capacity_mw: 500.0  # MW rated (matches natural_gas_plant)
    gas_min_load_fraction: 0.2  # min stable load as fraction of rated
    gas_ramp_fraction: 1.0  # per-hour ramp as fraction of rated (1.0 = unconstrained)
    gas_startup_cost: 5000.0  # $/start
    gas_min_up_time_h: 1  # hours
    gas_min_down_time_h: 1  # hours
    # Receding-horizon (MPC) settings: solve a `uc_horizon`-hour lookahead,
    # implement only the first `uc_control_step` hours, then roll forward.
    # uc_control_step: 1 => a true hourly controller, so the end-of-window
    # terminal SOC handling stays ~24 h from every applied decision.
    uc_horizon: 48
    uc_control_step: 24
    # Battery end-of-day SOC handling in the 24 h UC window:
    #   fixed_<NN>  -> force ~NN% at end of each day (±5% band, prevents
    #                  ratcheting). fixed_50 = 50%, fixed_80 = 80%, etc.
    #                  Higher targets keep more overnight reserve at the cost
    #                  of holding energy that could have served daytime load.
    #   track_init  -> end near the day's starting SOC (caps net daily
    #                  discharge, sidelines the battery -> most unmet load)
    #   charge_bias -> soft reward biases end-of-day SOC toward fully charged
    #                  (tops up from surplus renewables, keeps reserve for
    #                  overnight; still discharges deeply to serve load)
    soc_terminal_strategy: fixed_50
    # Optional: $/kWh reward on terminal SOC for charge_bias. Defaults to just
    # below gas marginal cost so gas is never burned to charge the battery.
    # soc_terminal_value: 0.03
  solver_options:
    solver_name: gauss_seidel
    max_iter: 20
    convergence_tolerance: 1.0e-6
finance_parameters:
  finance_groups:
    profast_lco:
      finance_model: ProFastLCO
      model_inputs:
        params: &profast_params
          analysis_start_year: 2032
          installation_time: 36  # months
          inflation_rate: 0.0  # 0 for nominal analysis
          discount_rate: 0.09  # nominal return based on 2024 ATB baseline workbook for land-based wind
          debt_equity_ratio: 2.62  # 2024 ATB uses 72.4% debt for land-based wind
          property_tax_and_insurance: 0.03  # percent of CAPEX estimated based on https://www.nlr.gov/docs/fy25osti/91775.pdf https://www.house.mn.gov/hrd/issinfo/clsrates.aspx
          total_income_tax_rate: 0.257  # 0.257 tax rate in 2024 atb baseline workbook, value here is based on federal (21%) and state in MN (9.8)
          capital_gains_tax_rate: 0.15  # H2FAST default
          sales_tax_rate: 0.07375  # total state and local sales tax in St. Louis County https://taxmaps.state.mn.us/salestax/
          debt_interest_rate: 0.07  # based on 2024 ATB nominal interest rate for land-based wind
          debt_type: Revolving debt  # can be "Revolving debt" or "One time loan". Revolving debt is H2FAST default and leads to much lower LCOH
          loan_period_if_used: 0  # H2FAST default, not used for revolving debt
          cash_onhand_months: 1  # H2FAST default
          admin_expense: 0.00  # percent of sales H2FAST default
        capital_items:
          depr_type: MACRS # can be "MACRS" or "Straight line"
          depr_period: 5  # 5  years - for clean energy facilities as specified by the IRS MACRS schedule https://www.irs.gov/publications/p946#en_US_2020_publink1000107507
          refurb: [0.]
    profast_npv:
      finance_model: ProFastNPV
      model_inputs:
        commodity_sell_price: 0.00
        commodity_sell_price_units: USD/(kW*h)
        params: *profast_params
        capital_items:
          depr_type: MACRS # can be "MACRS" or "Straight line"
          depr_period: 5  # 5  years - for clean energy facilities as specified by the IRS MACRS schedule https://www.irs.gov/publications/p946#en_US_2020_publink1000107507
          refurb: [0.]
  finance_subgroups:
    renewable_generation:
      commodity: electricity
      commodity_stream: renew_combiner
      finance_groups: [profast_lco, profast_npv]
      technologies: [solar, wind]
    natural_gas:
      commodity: electricity
      commodity_stream: natural_gas_plant
      finance_groups: [profast_lco, profast_npv]
      technologies: [natural_gas_plant, ng_feedstock]
    electricity:
      commodity: electricity
      # Under SLC there's no fictitious interconnect component; the combiner
      # is the final aggregated supply. Any electricity above demand ends up
      # as electrical_load_demand.unused_electricity_out (curtailment at the
      # load), not as `electricity_sold`.
      commodity_stream: combiner
      finance_groups: profast_lco
      technologies: [solar, wind, battery, natural_gas_plant, ng_feedstock]
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025  # used to adjust modeled costs to target_dollar_year
    target_dollar_year: 2022

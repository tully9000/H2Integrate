name: plant_config_rho_demand_following_battery
description: |
  Rolling Horizon Optimal Dispatch with demand following and battery storage.
  Extends plant_config_rho_base_battery.yaml with demand_following objective.
  Located in Texas, USA.
sites:
  site:
    latitude: 30.6617
    longitude: -101.7096
    resources:
      wind_resource:
        resource_model: WTKNLRDeveloperAPIWindResource
        resource_parameters:
          resource_year: 2013

technology_interconnections:
  # connect NG feedstock to NG plant
  - [ng_feedstock, natural_gas_plant, natural_gas, pipe]
  # wind output available for battery charging
  - [wind, battery, electricity, cable]
  # wind to combined output
  - [wind, combiner, electricity, cable]
  # battery net output to combined output
  - [battery, combiner, electricity, cable]
  # NG to combined output
  - [natural_gas_plant, combiner, electricity, cable]
  # combined supply to demand
  - [combiner, electrical_load_demand, electricity, cable]

site_to_tech_connections:
  # connect the wind resource to the wind technology
  - [site.wind_resource, wind, wind_resource_data]

plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760
    dt: 3600

system_level_control:
  control_strategy: RollingHorizonOptimalDispatch
  demand_component: electrical_load_demand
  control_parameters:
    rolling_horizon_optimal_dispatch:
      # Demand following objective with 24-hour lookahead
      objective_function: demand_following
      horizon_length_hours: 24
  solver_options:
    solver_name: gauss_seidel
    max_iter: 20
    convergence_tolerance: 1.0e-6

finance_parameters:
  finance_groups:
    profast_lco:
      finance_model: ProFastLCO
      model_inputs:
        params:
          analysis_start_year: 2032
          installation_time: 36
          inflation_rate: 0.0
          discount_rate: 0.09
          debt_equity_ratio: 2.62
          property_tax_and_insurance: 0.03
          total_income_tax_rate: 0.257
          capital_gains_tax_rate: 0.15
          sales_tax_rate: 0.07375
          debt_interest_rate: 0.07
          debt_type: Revolving debt
          loan_period_if_used: 0
          cash_onhand_months: 1
          admin_expense: 0.00
        capital_items:
          depr_type: MACRS
          depr_period: 5
          refurb: [0.]
    profast_npv:
      finance_model: ProFastNPV
      model_inputs:
        commodity_sell_price: 0.05167052
        commodity_sell_price_units: USD/(kW*h)
        params:
          analysis_start_year: 2032
          installation_time: 36
          inflation_rate: 0.0
          discount_rate: 0.09
          debt_equity_ratio: 2.62
          property_tax_and_insurance: 0.03
          total_income_tax_rate: 0.257
          capital_gains_tax_rate: 0.15
          sales_tax_rate: 0.07375
          debt_interest_rate: 0.07
          debt_type: Revolving debt
          loan_period_if_used: 0
          cash_onhand_months: 1
          admin_expense: 0.00
        capital_items:
          depr_type: MACRS
          depr_period: 5
          refurb: [0.]
  finance_subgroups:
    renewables:
      commodity: electricity
      commodity_stream: wind
      finance_groups: [profast_lco, profast_npv]
      technologies: [wind]
    natural_gas:
      commodity: electricity
      commodity_stream: natural_gas_plant
      finance_groups: [profast_lco]
      technologies: [natural_gas_plant, ng_feedstock]
    electricity:
      commodity: electricity
      commodity_stream: combiner
      finance_groups: [profast_lco]
      technologies: [wind, natural_gas_plant, ng_feedstock, battery]
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025
    target_dollar_year: 2022
